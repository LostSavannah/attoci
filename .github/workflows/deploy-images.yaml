name: Deploy docker images

on:
  workflow_dispatch: 

jobs:
  build-scratch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Deploy scratch image
        run: |
          docker build --target agent-scratch -t agent-scratch -f src/agent/Dockerfile src/agent
          docker login -u coderookieerick -p ${{ secrets.DOCKER_HUB }}
          docker tag agent-scratch coderookieerick/attoci:agent-scratch
          docker push coderookieerick/attoci:agent-scratch

  build-alpine:
    runs-on: ubuntu-latest
