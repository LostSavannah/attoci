          docker login -u coderookieerick -p ${{ secrets.DOCKER_HUB }}
          docker tag agent-golang coderookieerick/attoci:agent-golang
          docker push coderookieerick/attoci:agent-golang

  build-python:
    runs-on: ubuntu-latest
