        uses: docker/setup-buildx-action@v3

      - name: Deploy python image
        run: |
          docker build --target agent-python -t agent-python -f src/agent/Dockerfile src/agent
          docker login -u coderookieerick -p ${{ secrets.DOCKER_HUB }}
          docker tag agent-python coderookieerick/attoci:agent-python
          docker push coderookieerick/attoci:agent-python

  build-node:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Deploy node image
        run: |
          docker build --target agent-node -t agent-node -f src/agent/Dockerfile src/agent
          docker login -u coderookieerick -p ${{ secrets.DOCKER_HUB }}
